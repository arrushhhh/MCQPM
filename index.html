<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM MCQ Practice — AITU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF4; --paper:#FFFFFF; --ink:#16233D; --muted:#5B6782; --line:#CDD5E1;
  --accent:#2C55D6; --accent-soft:#DCE5FB;
  --ok:#17845A; --ok-soft:#DDF2E8; --bad:#C23B2A; --bad-soft:#FBE3DF;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --paper:#172036; --ink:#E6ECF7; --muted:#97A3BC; --line:#2A3654;
    --accent:#7E9DF5; --accent-soft:#22305A; --ok:#4CC08E; --ok-soft:#173A2D; --bad:#F08273; --bad-soft:#43201C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --paper:#172036; --ink:#E6ECF7; --muted:#97A3BC; --line:#2A3654;
  --accent:#7E9DF5; --accent-soft:#22305A; --ok:#4CC08E; --ok-soft:#173A2D; --bad:#F08273; --bad-soft:#43201C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.variants{display:flex;gap:6px;flex-wrap:wrap}
.variants button{border:1.5px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.9rem}
.variants button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.score{font-weight:700;font-size:1.05rem}
.score small{color:var(--muted);font-weight:500}
.progress{flex:1;min-width:140px;height:8px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress .p-ok{background:var(--ok)} .progress .p-bad{background:var(--bad)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:transparent;padding:6px 11px;border-radius:8px;font-size:.85rem;font-weight:600}
.tools button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin-bottom:18px}
.grid button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 0;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:2.5px solid var(--accent);outline-offset:1px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px)}
.qnum{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-weight:700;font-size:.9rem;margin-bottom:12px}
.qnum b{font-size:2.6rem;color:var(--ink);font-weight:800;letter-spacing:-.03em;line-height:1}
.scenario{font-family:var(--serif);font-size:1.08rem;line-height:1.65;margin:0 0 10px;max-width:68ch}
.question{font-weight:700;font-size:1.08rem;margin:0 0 18px;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--bg)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .l{background:var(--bad);color:#fff}
.explain{margin-top:16px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:.95rem}
.explain strong{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{border:none;border-radius:10px;padding:11px 20px;font-weight:700}
.nav .prev{background:var(--bg)}
.nav .next{background:var(--accent);color:#fff}
.nav button[disabled]{opacity:.35;cursor:default}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin-top:14px}

.done{text-align:center;padding:10px 0}
.done .big{font-size:clamp(3rem,12vw,5rem);font-weight:800;letter-spacing:-.04em;line-height:1}
.done p{color:var(--muted)}
.done .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.done button{border:none;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:#fff}
.done button.alt{background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Project Management MCQ</h1>
      <div class="sub">Lectures 1–3 · AITU practice — pick an answer to see if it's right</div>
    </div>
    <div class="variants" id="variants"></div>
  </header>

  <div class="bar">
    <div class="score" id="score"></div>
    <div class="progress" id="progress"><i class="p-ok"></i><i class="p-bad"></i></div>
    <div class="tools">
      <button id="btnShuffle" aria-pressed="false">Shuffle</button>
      <button id="btnWrong" aria-pressed="false">Only mistakes</button>
      <button id="btnReset">Reset</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="card" id="card"></div>
  <div class="hint">Keys: A–E to answer, ← → to move</div>
</div>

<script>
/* ===== QUESTION BANK — add new variants to this array ===== */
const VARIANTS = [
{ id:"v1", name:"Variant 1", questions:[
{s:"A ministry IT department has run the same citizen help-desk service for six years. It has no end date, uses the same staff every year, and its output is the same service repeated daily.",q:"Why does this help-desk service NOT meet the definition of a project?",o:["It does not consume human and nonhuman resources such as money and people.","It is not temporary and does not create a unique result.","It does not cut across several functional lines of the organization.","It is not managed by a person who reports to the executive officers.","It does not have a funding limit approved by the ministry each year."],a:1,e:"A project is temporary (defined start and end) and produces a unique result. Repetitive ongoing work is operations."},
{s:"A team in Astana is asked to select the best project given resource limits, recognize the benefits of the project, prepare the documents to sanction it and assign the project manager.",q:"Which process group do these activities belong to?",o:["Project execution.","Project closure.","Project initiation.","Project monitoring and control.","Project planning."],a:2,e:"Selecting the project, recognizing benefits, sanctioning documents and assigning the PM are all initiation activities."},
{s:"A project manager is tracking progress, comparing the actual outcome to the predicted outcome, analyzing variances and impacts, and making adjustments.",q:"Which process group is the project manager working in?",o:["Monitoring and control.","Planning.","Execution.","Initiation.","Closure."],a:0,e:"Tracking, comparing actual vs. predicted, analyzing variances and adjusting = monitoring and control."},
{s:"An e-government portal was delivered on time, within cost, at the specified performance level and was accepted by the customer. However, the project used twice as many programmers as assigned because the team was poorly organized.",q:"Which element of successful project management was NOT achieved?",o:["Achieving the desired performance or technology level.","Utilizing the assigned resources effectively and efficiently.","Obtaining acceptance of the result by the customer.","Completing the project within the allocated time period.","Completing the project within the budgeted cost."],a:1,e:"Time, cost, performance and acceptance were met; doubling the programmers means resources were not used effectively and efficiently."},
{s:"A company introduces formal project management and expects to gain specific benefits from it.",q:"Which of the following is considered a potential benefit of project management?",o:["Guarantee that every project will be completed under budget.","Transfer of the staffing function from line managers to the project manager.","Removal of all scope changes requested by the customer.","Early identification of problems so that corrective action may follow.","Elimination of the need for line managers to assign resources."],a:3,e:"Kerzner lists early identification of problems so corrective action may follow as a benefit. Nothing is guaranteed, and staffing stays with line managers."},
{s:"A project manager explains to the sponsor that the benefits of project management cannot be achieved without overcoming certain obstacles.",q:"Which of the following is such an obstacle?",o:["Customer's special requirements and scope changes.","Identification of time limits for scheduling.","Minimizing the need for continuous reporting.","Measurement of accomplishment against plans.","Improved estimating capability for future planning."],a:0,e:"Obstacles: project complexity, customer's special requirements and scope changes, organizational restructuring, risks, technology change, forward planning and pricing. The other options are benefits."},
{s:"A project manager at an IT company asks the head of the testing department for two senior testers. The department head answers that only one junior tester can be released this month.",q:"Who makes the final decision about which resources will be committed to the project?",o:["The customer, because the customer must accept the final deliverable.","The executive officers, because they are organizational stakeholders.","The project manager, because directing the work is part of the PM definition.","The project team, because it consumes the human and nonhuman resources.","The line manager, because staffing is a line responsibility."],a:4,e:"Staffing is a line responsibility; the line manager decides which resources are committed. The PM only negotiates."},
{s:"A student compares the classical five functions of management with the definition of project management.",q:"Which classical management function is intentionally omitted from the definition of project management?",o:["Staffing.","Organizing.","Directing.","Planning.","Controlling."],a:0,e:"PM = planning, organizing, directing and controlling. Staffing is omitted because it is a line responsibility."},
{s:"During a software project the team produces a series of interim progress reports that evolve as the project proceeds, and at the end delivers the final report.",q:"How should these evolving reports be classified?",o:["Final deliverables, because each report closes a life-cycle phase.","Organizational deliverables, because they are produced for line managers.","Interim deliverables, which progressively evolve during the project.","Hardware deliverables, because reports are tangible physical items.","Capital market deliverables, because they are read by shareholders and banks."],a:2,e:"Deliverables that progressively evolve during the project are interim deliverables."},
{s:"A project to build a data center in Karaganda is monitored by local committees, a government inspection body and the general public.",q:"To which stakeholder category from the typical categorization system do these groups belong?",o:["Capital market stakeholders.","Product/market stakeholders.","Functional stakeholders.","Internal stakeholders.","Organizational stakeholders."],a:1,e:"Product/market stakeholders: customers, suppliers, local committees, governments and the general public."},
{s:"A bank that provided a loan for a project and the company's shareholders both ask for regular financial updates.",q:"In the typical stakeholder categorization, these two groups are examples of which category?",o:["Line stakeholders.","Product/market stakeholders.","Customer stakeholders.","Capital market stakeholders.","Organizational stakeholders."],a:3,e:"Capital market stakeholders: shareholders and creditors such as banks."},
{s:"A project was finished on time and on budget, but to do so the project manager borrowed so many engineers from production that the company's main production line stopped for two weeks.",q:"Which criterion from the expanded definition of project success was violated?",o:["Completion with minimum or mutually agreed upon scope changes.","Completion with acceptance by the customer or user.","Completion within the budgeted cost.","Completion without disturbing the main work flow of the organization.","Completion at the proper performance or specification level."],a:3,e:"Stopping the main production line disturbs the organization's main work flow."},
{s:"Successful project management is said to depend strongly on the relationship between two roles.",q:"Which relationship is this?",o:["A financial relationship between the project manager and the company's creditors.","A reporting relationship between the project manager and the shareholders.","A formal relationship between the project manager and government inspectors.","A contractual relationship between the project manager and the customer's lawyers, defined in the charter.","A good daily working relationship between the project manager and the line managers who assign resources."],a:4,e:"Kerzner: success depends on a good daily working relationship between the PM and the line managers who assign resources."},
{s:"A project manager spends most of her time managing relationships within the project team, between the team and the functional departments, between the team and senior management, and between the team and the customer.",q:"What is this role called?",o:["Financial closure.","Contractual closure.","Resource leveling.","Line management.","Interface management."],a:4,e:"Managing these human interfaces/relationships is interface management."},
{s:"Project management is often used as a training ground for future general managers.",q:"What is the reason for this?",o:["Project managers get to know the total operation of the company, often more than most executives.","Project managers have the final authority to staff every department.","Project managers control the company's relationships with its capital market stakeholders such as banks.","Project managers are responsible for the corporate culture of the company.","Project managers approve the budgets of all functional departments."],a:0,e:"Working across all functional lines, PMs learn the total operation of the company."},
{s:"A new project manager asks what planning means in a project environment.",q:"How is planning in a project environment best described?",o:["Auditing the supporting data of the cost proposal.","Selecting the lowest-cost supplier for every purchased item.","A predetermined course of action within a forecasted environment.","Recording the actual hours worked by every team member.","Negotiating the final price of the contract with the customer."],a:2,e:"Kerzner's definition: planning is determining a predetermined course of action within a forecasted environment."},
{s:"The requirements of a project set a major milestone for the end of May. The line managers refuse to commit because they consider the date unrealistic.",q:"What may the project manager have to do in this situation?",o:["Remove the milestone from the plan entirely so that no commitment from the line managers is needed at all.","Sign the charter on behalf of the sponsor so that the line managers are legally forced to commit to the original date.","Ask the customer to take over the staffing of the project.","Develop alternatives, possibly moving the milestone, with upper management involved in the choice.","Replace the line managers with employees who accept the date."],a:3,e:"The PM develops alternatives (possibly moving the milestone) and involves upper management in selecting one."},
{s:"A project manager insists on being involved from project conception through execution and repeats the planning several times during the project.",q:"Which statement supports this behavior?",o:["Project planning is an iterative process and must be performed throughout the life of the project.","Planning is completed once the charter is signed by the sponsor and should not be repeated afterwards.","Planning must be finished before the project manager is assigned.","Planning should be delegated entirely to the functional units.","Planning is only needed for projects longer than one year."],a:0,e:"Planning is iterative and continues throughout the project's life."},
{s:"A software project started without defined requirements. First everyone was enthusiastic, then disillusioned, then chaos followed, and finally managers began to search for the guilty.",q:"What does this sequence illustrate?",o:["Consequences of poor planning.","The nine components of the planning phase.","The steps of network replanning.","The stages of the estimating life cycle.","The five process groups of project management."],a:0,e:"The classic phases of a poorly planned project: enthusiasm → disillusionment → chaos → search for the guilty → punishment of the innocent → promotion of the nonparticipants."},
{s:"A project manager lists the purposes of planning for the team.",q:"Which of the following is one of the purposes of planning?",o:["To remove the line managers from resource decisions.","To reduce the number of stakeholders in the project.","To provide a basis for monitoring and controlling work.","To transfer all risks to the customer.","To eliminate the need for a project charter."],a:2,e:"Planning gives the baseline against which work is monitored and controlled."},
{s:"A planning document states: 'Every code change must be reviewed by a second developer before it is merged.'",q:"Which of the nine components of the planning phase is this an example of?",o:["Procedure, a detailed method for carrying out a policy.","Standard, a level of performance defined as adequate or acceptable.","Budget, planned expenditures required to achieve the objectives.","Forecast, a projection of what will happen by a certain time.","Objective, a goal, target or quota to be achieved by a certain time."],a:0,e:"It prescribes a specific method of doing the work, i.e. a procedure (detailed method for carrying out a policy). A performance level would be a standard."},
{s:"A planning document states: 'The support team must resolve at least 90 percent of tickets within 24 hours.' This describes the level of performance that is considered acceptable.",q:"Which planning component is this?",o:["Organization.","Standard.","Policy.","Schedule.","Program."],a:1,e:"A level of performance defined as adequate or acceptable = standard."},
{s:"A sponsor asks what the project charter is used for today.",q:"What is today's role of the project charter?",o:["A record of actual labor hours billed back to the project.","An internal legal document stating the project manager's authority and the approved scope.","A detailed network diagram showing the critical path, the slack of every event and the resource loading of the project.","A list of the overhead rates applied to direct labor.","A cost proposal submitted to the customer together with the supporting data and the labor justification."],a:1,e:"Today the charter is an internal legal document identifying the PM, their authority, and the project's scope/objectives."},
{s:"A student asks who actually writes the project charter.",q:"Which statement about the preparation of the charter is correct?",o:["The proposal manager prepares it during the pricing kickoff meeting.","The line managers prepare it jointly and the customer signs it.","In theory the sponsor prepares it; in reality the PM may prepare it for the sponsor's signature.","The functional employees prepare it as part of resource leveling.","The customer always prepares it during contract negotiation, and the line managers sign it before work begins."],a:2,e:"Theoretically the sponsor prepares the charter; in practice the PM often writes it and the sponsor signs."},
{s:"A project manager wants to see interdependencies of activities, the impact of late starts, trade-offs between resources and time, and the cost of a crash program.",q:"Which scheduling technique provides this management information?",o:["Line of balance.","Milestone charts.","The project charter.","Gantt or bar charts.","Network techniques."],a:4,e:"Network techniques (PERT/CPM) show interdependencies, late-start impacts, time–resource trade-offs and crashing cost. Gantt charts can't show interdependencies well."},
{s:"A colleague says that the Arrow Diagram Method (ADM) is sometimes called by another name.",q:"What is the alternative name for ADM?",o:["Graphical Evaluation and Review Technique (GERT).","Program Evaluation and Review Technique (PERT).","Line of balance.","Critical Path Method (CPM).","Precedence Diagram Method (PDM)."],a:3,e:"Kerzner: ADM (activity-on-arrow) is sometimes referred to as the Critical Path Method (CPM). PDM is the activity-on-node alternative."},
{s:"In a network, an activity called 'Write user manual' has a duration of one month, but the technical writer actually works on it only during two weeks within that month.",q:"How are these two quantities correctly distinguished?",o:["The slack is one month and the duration is two weeks.","The duration is one month and the effort is two weeks.","The event is one month and the activity is two weeks.","The duration is one month and the float is two weeks.","The effort is one month and the duration is two weeks."],a:1,e:"Duration = elapsed calendar time (1 month); effort = actual work time (2 weeks)."},
{s:"To convert a large project into a PERT network, a project manager asks for each job: 'What job immediately precedes this job? What job immediately follows this job?'",q:"Which third question must also be answered?",o:["What is the department average salary for this job?","Which stakeholder approved this job?","Which process group does this job belong to?","What jobs can be run concurrently?","What is the overhead rate for this job?"],a:3,e:"The three questions: what precedes, what follows, and what jobs can run concurrently."},
{s:"A small network has three paths from start to finish. Path 1: A (4 days) – B (5 days) – C (3 days). Path 2: A (4 days) – D (6 days) – C (3 days). Path 3: E (2 days) – F (7 days) – C (3 days).",q:"Which path is the critical path and what is the project duration?",o:["Path 1, 13 days.","Path 2, 10 days.","Path 1, 12 days.","Path 2, 13 days.","Path 3, 12 days."],a:3,e:"Path 1 = 4+5+3 = 12; Path 2 = 4+6+3 = 13; Path 3 = 2+7+3 = 12. Longest = Path 2, 13 days."},
{s:"In a PERT network, event 3 has an earliest expected time TE = 2 weeks and a latest allowable time TL = 5 weeks.",q:"What is the slack time of event 3?",o:["0 weeks.","2 weeks.","5 weeks.","3 weeks.","7 weeks."],a:3,e:"Slack = TL − TE = 5 − 2 = 3 weeks."},
{s:"A test activity in a research project may fail, in which case the test must be repeated several times; depending on the result, one of several branches will be selected.",q:"Which technique can represent this situation that PERT cannot easily show?",o:["A Gantt chart, which shows activities as horizontal bars.","A milestone chart, which shows when events start or finish.","ADM, which is sometimes called the Critical Path Method.","Line of balance, which is used for repetitive production.","GERT, which allows looping and branching."],a:4,e:"GERT (Graphical Evaluation and Review Technique) allows looping (repeat test) and probabilistic branching."},
{s:"In a construction project, the walls of a house must be erected before the roof can be put up.",q:"Which type of dependency is this?",o:["Mandatory dependency (hard logic).","Discretionary dependency (soft logic).","External dependency.","Resource dependency.","Dummy dependency."],a:0,e:"Inherent physical constraint → mandatory dependency (hard logic)."},
{s:"A project manager decides that procurement may start before the entire bill of materials is completed, although on another project the same manager required the full list first.",q:"Which type of dependency is this?",o:["Negative-slack dependency.","Critical dependency.","Mandatory dependency (hard logic).","External dependency.","Discretionary dependency (soft logic)."],a:4,e:"The sequence is the manager's choice and can differ between projects → discretionary (soft logic)."},
{s:"An activity has an earliest start ES = 8, an earliest finish EF = 10, a latest start LS = 15 and a latest finish LF = 17.",q:"How many time units of slack does this activity have?",o:["17.","5.","2.","9.","7."],a:4,e:"Slack = LS − ES = 15 − 8 = 7 (= LF − EF = 17 − 10 = 7)."},
{s:"The forward pass through a network shows that the project will finish on day 60, but the customer's contractual end date is day 55, and the backward pass is measured from day 55.",q:"What is this situation called, and what is a likely cause?",o:["Zero slack; a likely cause is that all activities are on the critical path.","Maximum float; a likely cause is that resource leveling changed the end date.","Dummy activity; a likely cause is that two activities share the same events.","Positive slack; a likely cause is that the original plan was pessimistic.","Negative slack; a likely cause is that the customer's end date was unrealistic."],a:4,e:"Required end date earlier than the forward-pass finish gives negative slack (−5), often because the customer's date was unrealistic."},
{s:"A manager says that pricing is 'an art' because information on customer budgets and competitive prices is uncertain.",q:"What is a side benefit of using a disciplined management process for pricing?",o:["It removes the need for supporting data on cost-reimbursable contracts.","It leads to the documentation of the many factors and assumptions involved, which can be analyzed later.","It eliminates the buy-in decision from the pricing process.","It guarantees that the company will always submit the lowest bid and therefore win the competitive tender.","It allows the customer to audit the books on a fixed-price contract."],a:1,e:"A disciplined process documents the factors and assumptions so they can be analyzed later."},
{s:"An estimator uses a mathematical equation, derived by regression analysis from past projects, to predict the cost of a new software module from its number of screens.",q:"How should this estimating basis be classified?",o:["A forward pricing rate for overhead and indirect costs.","A supporting-data audit requested by the customer.","A cost estimating relationship (CER), which is generally the output of a cost model.","A buy-in decision based on expected bail-out changes.","A definitive estimate prepared bottom-up from the work breakdown structure over several months."],a:2,e:"A regression equation linking cost to a parameter is a cost estimating relationship (CER), the basis of parametric estimating."},
{s:"A company bids for a one-of-a-kind program with little or no follow-on potential.",q:"What is the business objective for this type I acquisition?",o:["To win the program at any price in order to enter a new market segment.","To win the program and execute it profitably and satisfactorily according to the contract.","To bid below cost and explain to the customer where the additional funding comes from.","To gain a foothold with a new customer community in place of making a profit.","To determine the 'should-cost' including risk adjustments and accept a negative margin."],a:1,e:"Type I (one-of-a-kind, no follow-on): win the program and execute it profitably and satisfactorily."},
{s:"A company sees a tender as an entry point to large follow-on business with a new customer. The pricing team determines the gross profit margin necessary to win, and this margin turns out to be negative.",q:"According to the two global pricing strategies, how should the company treat this situation?",o:["It is a type I acquisition; the company must add the desired margin and raise the price.","It is a type II acquisition; a negative margin automatically disqualifies the bid.","It is a type II acquisition; a negative margin may be accepted if the desire to win is strong.","It is neither type; the company must ask the customer to increase its budget.","It is a type I acquisition; the company must bid only if the price is within the competitive range."],a:2,e:"Type II (follow-on potential): if the desire to win is strong, the company may accept a negative margin to enter the market."},
{s:"Before starting an estimate, an estimator collects information.",q:"Which of the following is typical information collected before estimating?",o:["The signatures of the capital market stakeholders.","The list of consequences of poor planning.","Interviews with subject matter experts.","The three types of dependencies in the network.","The resumes of the customer's line managers."],a:2,e:"Typical inputs: historical data, interviews with subject matter experts, specifications, etc."},
{s:"A ministry needs a cost estimate for a feasibility study of a new digital service. The estimate must be ready in a few days, and an accuracy of −25% to +75% is acceptable.",q:"Which estimating method and generic type from the standard estimating-method table fit these requirements?",o:["Engineering method, budget estimate, top down.","Analogy method, budget estimate, top down.","Analogy method, definitive estimate, bottom up.","Engineering (grass roots) method, definitive estimate, bottom up.","Parametric method, rough order of magnitude (ROM), top down."],a:4,e:"Parametric = ROM, top down, −25% to +75%, prepared in days. Analogy = budget (−10/+25%, weeks); Engineering = definitive (−5/+10%, months)."},
{s:"A customer requires a definitive estimate with an accuracy of −5% to +10%.",q:"According to the standard estimating-method table, which method is used and roughly how long does it take to prepare?",o:["Parametric, bottom up, taking weeks.","Analogy, bottom up, taking months.","Analogy, top down, taking weeks.","Engineering (grass roots), taking months.","Parametric, top down, taking days."],a:3,e:"Definitive (−5/+10%) = engineering (grass roots), bottom up, takes months."},
{s:"An estimate is presented with an accuracy of plus or minus 5 percent.",q:"Which class of estimate is this according to the standard classes of estimates?",o:["Class VI, order of magnitude.","Class I, definitive.","Class V, feasibility.","Class II, capital cost.","Class IV, appropriation."],a:1,e:"Class I = definitive, ±5%."},
{s:"An in-house project is at the conceptual stage: the company is doing venture guidance and feasibility studies for the evaluation of future work.",q:"On what information is the estimate based at this stage?",o:["Preliminary design and scope.","Major scope changes beyond the authorization range.","Actual salaries of identified employees.","Minimum-scope information.","Detailed work packages of the main stage."],a:3,e:"Conceptual stage (venture guidance, feasibility) estimates are based on minimum-scope information."},
{s:"The pricing process has produced the work breakdown structure and the activity schedules.",q:"What is the third operational tool needed to control the project, and how is it obtained?",o:["The total program costs, obtained by pricing out the activities over the schedule.","The customer's budget, obtained from the request for proposal.","The critical path, obtained by the backward pass through the network.","The overhead rate, obtained from the corporate accounting department.","The project charter, obtained when the sponsor signs the document prepared by the project manager."],a:0,e:"Three tools: WBS, activity schedules, and total program costs (activities priced out over the schedule)."},
{s:"A program manager calls a kickoff meeting for all organizations that will submit pricing information and describes the WBS in depth.",q:"Besides explaining responsibilities, what other purpose does the kickoff meeting serve?",o:["It assigns the critical path activities to the proposal manager.","It determines the department average salary used for billing.","It sets the customer's end date for the whole project and the dates of all major milestones.","It replaces the need for supporting data in the proposal.","It resolves the struggle for power among functional managers with similar responsibilities."],a:4,e:"Kerzner: the kickoff meeting also resolves power struggles among functional managers with similar responsibilities."},
{s:"Functional units submit labor hours that are much higher than needed because they fear that management will 'massage' and reduce them.",q:"What is the most common solution to the resulting conflict between program and functional managers?",o:["The program manager selects team members who know each department's man-hour standards, so that trust develops.","The proposal manager doubles the proposal schedule to allow more justification time.","The customer audits the submitted labor hours, compares them with its own budget and sets the final figures for the proposal.","The program manager accepts all submitted hours without discussion, so that the functional managers keep their present staff and no conflict arises.","The functional managers are removed from the pricing process entirely."],a:0,e:"Most common solution: staff the pricing team with people who know the departments' man-hour standards, building trust."},
{s:"A company signed a cost-reimbursable contract with a government customer. The customer now asks to compare the company's exact costs with the backup support data.",q:"Why can the customer do this?",o:["Because the customer signed the project charter.","Because the low-bidder dilemma requires disclosure of all costs.","On a cost-reimbursable package the costs are an open book.","On a fixed-price contract the customer always has the right to audit the books.","Because supporting data must never be traceable by charge numbers."],a:2,e:"On cost-reimbursable contracts, costs are an open book and the customer can audit them against supporting data."},
{s:"An IT company deliberately bids below its estimated cost, assuming that it will later recover the loss through 'bail-out' changes, spare parts and maintenance contracts.",q:"How should this decision be characterized?",o:["A risk identification tool based on expected value measures.","The buy-in decision, probably the most serious estimating pitfall.","A type I pricing strategy in which the company adds its desired margin and bids only within the competitive range.","A standard method of billing work at the department average salary.","A correct use of forward pricing rates for overhead costs."],a:1,e:"Bidding below cost hoping to recover later = buy-in, probably the most serious estimating pitfall."},
{s:"A project manager wants to follow the six-step risk management process.",q:"Which of the following sequences correctly lists the first three of the six steps?",o:["Developing a strategy, taking action, quantifying the risk.","Prioritizing the risk, identification of the risk, quantifying the risk.","Identification of the risk, quantifying the risk, prioritizing the risk.","Quantifying the risk, taking action, prioritizing the risk.","Taking action, project sponsor review, identification of the risk."],a:2,e:"Identify → quantify → prioritize → develop strategy → take action → sponsor review."}
]},
{ id:"v2", name:"Variant 2", questions:[
{s:"A university department will migrate its student records to a new cloud platform. The work starts on 1 October, must finish by 30 April, has a fixed budget, and involves the IT, registrar and finance offices.",q:"Which characteristic of a project is shown by the involvement of the IT, registrar and finance offices?",o:["The work has a specific objective within certain specifications.","The work has a funding limit.","The work has defined start and end dates.","The work consumes human and nonhuman resources.","The work is multifunctional."],a:4,e:"Cutting across several functional lines (IT, registrar, finance) = multifunctional."},
{s:"A project manager is defining the work requirements, the quality and quantity of work, the resources needed, scheduling the activities and evaluating the various risks.",q:"Which process group is being performed?",o:["Project closure.","Project initiation.","Project monitoring and control.","Project execution.","Project planning."],a:4,e:"Defining requirements, quality/quantity, resources, schedule and risks = planning."},
{s:"At the end of a project the manager verifies that all work has been accomplished, closes the contract, closes the charge numbers financially and completes the administrative paperwork.",q:"Which process group do these activities belong to?",o:["Project closure.","Project monitoring and control.","Project planning.","Project initiation.","Project execution."],a:0,e:"Verifying completion, contractual/financial/administrative closure = closure."},
{s:"A project manager is negotiating for project team members, directing and managing the work and working with team members to help them improve.",q:"Which process group includes these activities?",o:["Project execution.","Project closure.","Project planning.","Project initiation.","Project monitoring and control."],a:0,e:"Negotiating for team members, directing/managing the work and developing the team = execution."},
{s:"A mobile application was delivered within time and cost and accepted by the customer, but it processes only 200 transactions per minute instead of the required 1,000.",q:"Which element of successful project management was NOT achieved?",o:["Utilizing the assigned resources effectively and efficiently.","Obtaining acceptance by the customer.","Achieving the desired performance or technology level.","Completing the project within time.","Completing the project within cost."],a:2,e:"200 vs. 1,000 transactions means the required performance/technology level was not reached."},
{s:"A company wants to know early when project objectives cannot be met or will be exceeded.",q:"This ability is best described as which of the following?",o:["A hardware deliverable.","An obstacle to project management.","A potential benefit of project management.","A classical management function.","A capital market stakeholder requirement."],a:2,e:"Knowing early when objectives can't be met or will be exceeded is listed among the potential benefits of PM."},
{s:"A project manager reads the overview definition of project management.",q:"Which four functions does that definition include?",o:["Planning, staffing, pricing and auditing of company resources.","Planning, organizing, directing and controlling of company resources.","Organizing, staffing, directing and reporting of company resources.","Planning, estimating, staffing and controlling of company resources.","Initiating, staffing, executing and closing of company resources."],a:1,e:"PM = planning, organizing, directing and controlling of company resources (staffing is omitted)."},
{s:"In a company, software developers report to the head of the development department and at the same time work on two projects led by two different project managers.",q:"How is this arrangement best described?",o:["The developers are interim deliverables shared between the projects.","The project managers have taken over the staffing function from the line manager, which is called the horizontal hierarchy.","Functional personnel (vertical hierarchy) are assigned to projects (horizontal hierarchy).","The developers are capital market stakeholders of both projects, because they influence the direction of the work.","The company has abandoned the classical functions of management."],a:2,e:"Functional (vertical) personnel are assigned to projects (horizontal hierarchy); staffing stays with the line."},
{s:"A prototype of a smart meter and the equipment used for testing it are handed over at the end of a phase.",q:"How should these outputs be classified?",o:["Interim deliverables.","Capital deliverables.","Software deliverables.","Hardware deliverables.","Organizational deliverables."],a:3,e:"Physical items such as a prototype and test equipment are hardware deliverables."},
{s:"A student reads that deliverables are 'outputs, or the end result of either the completion of the project or the end of a life-cycle phase'.",q:"What may influence who is assigned as project manager?",o:["The deliverables and the stakeholders.","The length of the critical path in the network.","The accuracy class of the cost estimate.","The type of contract signed with the customer.","The number of overhead elements in the budget."],a:0,e:"Kerzner: the deliverables and the stakeholders can influence who is assigned as PM."},
{s:"The executive officers, the line managers, the employees and the trade union of a company all have an interest in a restructuring project.",q:"Which stakeholder category do they represent?",o:["Product/market stakeholders.","Capital market stakeholders.","Customer stakeholders.","External stakeholders.","Organizational stakeholders."],a:4,e:"Organizational stakeholders: executives, line managers, employees, unions."},
{s:"A project was completed on time, within budget and accepted by the customer, but the customer requested 40 scope changes during the project, most of which were disputed.",q:"Which criterion from the expanded definition of project success was NOT met?",o:["Completion with minimum or mutually agreed upon scope changes.","Completion within the budgeted cost.","Completion without changing the corporate culture.","Completion at the proper performance or specification level.","Completion within the allocated time period."],a:0,e:"Many disputed scope changes violate 'minimum or mutually agreed upon scope changes'."},
{s:"The project manager and line managers must interface over a set of resources.",q:"Which of the following lists only resources belonging to the project manager – line manager interface?",o:["Facilities, policies, procedures, standards, programs, schedules.","Money, contracts, overhead, shareholders, banks, unions.","Equipment, charters, proposals, estimates, budgets, forecasts.","Manpower, slack, float, events, activities, milestones.","Money, manpower, equipment, facilities, materials, information."],a:4,e:"The PM–line manager interface resources: money, manpower, equipment, facilities, materials, information/technology."},
{s:"A project manager describes her job as integration.",q:"Which three integration activities belong to the project manager?",o:["Integrating the customer, the shareholders and the banks into one steering committee.","Integrating hardware, software and interim deliverables into one report.","Integrating the forward pass, the backward pass and the slack calculation.","Developing the project plan, executing the plan, and making changes to the plan.","Integrating the pricing, overhead and materials estimates of the functional units into one cost proposal."],a:3,e:"PM integration: developing the plan, executing the plan, and making changes to the plan."},
{s:"A senior manager argues that the project manager should staff the project directly, because the project manager knows the work best.",q:"Which statement contradicts this argument?",o:["Deliverables determine which employees the project manager must hire.","Staffing belongs to the execution process group and is done by the sponsor, who negotiates for the team members.","The project manager is actually a general manager and therefore has the authority to hire all employees needed by the project.","The project manager may request specific resources, but the final decision rests with the line managers.","The customer decides which functional personnel will work on the project."],a:3,e:"The PM can request specific people, but line managers make the final staffing decision."},
{s:"A student asks which responsibilities of a project manager are the most important.",q:"Which answer is correct?",o:["Pricing, auditing and billing labor.","Reporting, archiving and closing charge numbers.","Hiring, promoting and dismissing staff.","Selling, marketing and negotiating contracts.","Planning, integrating and executing plans."],a:4,e:"The PM's key responsibilities: planning, integrating and executing plans."},
{s:"Each functional unit in a company develops its own planning documents with little regard for the other units.",q:"Why is integration of the planning activities necessary?",o:["Because the critical path must pass through every functional unit and each unit must approve the network.","Because the sponsor cannot sign more than one charter.","Because overhead rates differ between functional units.","Because the customer requires a single consolidated plan before it will sign the contract and release funding.","Because each functional unit may plan with little regard for the other units."],a:4,e:"Integration is needed because each functional unit tends to plan in isolation."},
{s:"A task is highly uncertain and poorly understood before it begins.",q:"What will happen during execution of such a task?",o:["The task will have zero slack, become part of the critical path and determine the completion date of the project.","The task must be removed from the charter.","More knowledge is gained, leading to changes in resources, schedules and priorities.","The task can be fully preplanned before execution, so that resource allocations, schedules and priorities will not change.","The task will be priced at the department average salary."],a:2,e:"For uncertain tasks, knowledge is gained during execution, which changes resources, schedules and priorities."},
{s:"After a failed project, the company promoted the managers who had not participated in the project and punished the innocent team members.",q:"These outcomes are examples of which of the following?",o:["Purposes of network planning.","Steps of the risk management process.","Types of dependencies.","Consequences of poor planning.","Contents of the project charter."],a:3,e:"Punishment of the innocent and promotion of nonparticipants are the last stages of the consequences of poor planning."},
{s:"A plan states: 'Complete the pilot of the e-services portal in three regions by 31 March.'",q:"Which of the nine planning components is this?",o:["Procedure, a detailed method for carrying out a policy.","Organization, the design of positions and duties.","Standard, a level of performance defined as acceptable.","Policy, a general guide for decision-making.","Objective, a target to be achieved by a certain time."],a:4,e:"A target to achieve by a certain date = objective."},
{s:"A plan describes the number and kinds of positions in the project team, together with the duties and responsibilities of each position.",q:"Which planning component is this?",o:["Schedule.","Program.","Organization.","Forecast.","Budget."],a:2,e:"Number/kinds of positions with duties and responsibilities = organization."},
{s:"A plan contains a general guide for decision-making: 'Open-source components are preferred over proprietary ones whenever possible.'",q:"Which planning component is this?",o:["Policy.","Objective.","Standard.","Procedure.","Forecast."],a:0,e:"A general guide for decision-making = policy."},
{s:"A project manager is drafting the minimum content of a project charter.",q:"Which of the following must be included?",o:["The overhead rate elements such as cafeteria and postage.","Identification of the project manager and his or her authority to apply resources to the project.","The customer's competitive pricing information.","The actual salaries of all employees who will perform the work, listed by department and charge number.","The forward and backward pass calculations for every activity."],a:1,e:"At minimum the charter identifies the PM and their authority to apply resources, plus the business purpose."},
{s:"Some companies have converted the charter into a highly detailed document.",q:"Which of the following belongs in such a detailed charter?",o:["The consequences of poor planning.","Responsibility assignment matrix.","The list of capital market stakeholders.","The six steps of the risk management process.","Classes of estimates with their accuracy."],a:1,e:"Detailed charters can contain scope, assumptions, constraints, schedules, budgets and a responsibility assignment matrix."},
{s:"A manager wants to eliminate the need for crisis management on a large project.",q:"What is the primary purpose of network planning?",o:["To eliminate the need for crisis management by providing a pictorial representation of the total program.","To determine the department average salary for each activity so that labor can be billed back to the project.","To replace the project charter with a network diagram that documents the project manager's authority.","To calculate the overhead rate for the project.","To transfer schedule risk to the customer."],a:0,e:"Kerzner: the primary purpose of network planning is to eliminate crisis management by giving a pictorial view of the whole program."},
{s:"In a PERT network, one circle labelled '26' has arrows going out to three other circles labelled '31', '18' and '7'.",q:"What is the circle labelled '26' called?",o:["A critical event.","A burst point (source).","A milestone chart.","A dummy activity.","A sink."],a:1,e:"An event with several activities leaving it is a burst point (source). Many arrows entering = sink."},
{s:"A student reads the definition of an event in a network.",q:"Which definition of an event is correct?",o:["The longest path through the network.","A milestone indicating when an activity starts or finishes.","The element of work that must be accomplished.","The total time required to complete the activity.","The amount of work actually performed within the duration."],a:1,e:"Event = milestone marking when an activity starts or finishes. Work element = activity."},
{s:"The critical path of a project has been identified. The project manager explains to management why this path matters.",q:"Which two things does the critical path tell management?",o:["The path shows the department average salary, and it sets the overhead rate.","The activities on this path have the most slack, and they can therefore be delayed without any effect on the end date of the program.","Any slippage on it delays the end date unless recovered downstream, and management must take a hard look at its events.","The activities on this path are the cheapest, and they should be priced first in the proposal.","The events on this path are optional, and they may be removed to shorten the project."],a:2,e:"Slippage on the critical path delays the end date unless recovered, so management must watch its events closely."},
{s:"Two activities A and B start from the same event. Activity D depends only on A, but activity C depends on both A and B. The planner draws a dashed arrow with zero duration to show this logic.",q:"What is this dashed arrow called?",o:["A burst point.","A negative slack.","A sink.","A dummy activity.","A discretionary dependency."],a:3,e:"A zero-duration dashed arrow showing logic only = dummy activity."},
{s:"A project's critical path includes work performed by an external contractor whose schedule the project manager cannot control.",q:"Which type of dependency is this?",o:["External dependency.","Mandatory dependency (hard logic).","Resource dependency.","Discretionary dependency (soft logic).","Internal dependency."],a:0,e:"Dependence on parties outside the project's control = external dependency."},
{s:"In a network, event 4 has TE = 6 and TL = 9, while event 5 has TE = 10 and TL = 10.",q:"Which event lies on the critical path, and what is the slack of the other event?",o:["Event 5 is on the critical path; event 4 has 3 units of slack.","Both events are on the critical path; neither has slack.","Event 4 is on the critical path; event 5 has 0 units of slack.","Event 5 is on the critical path; event 4 has 15 units of slack.","Event 4 is on the critical path; event 5 has 3 units of slack."],a:0,e:"Event 5: 10 − 10 = 0 → critical. Event 4: 9 − 6 = 3 slack."},
{s:"A network has two paths. Path X: 3 + 3 + 6 = 12 days. Path Y: 3 + 7 + 5 = 15 days.",q:"What is the shortest time in which the project can be completed?",o:["27 days, because both paths must be added together.","3 days, because that is the slack between the paths.","13.5 days, the average of the two paths.","12 days, because the shortest path determines the project duration.","15 days, because the longest path determines the project duration."],a:4,e:"The longest path (critical path) sets the minimum project duration: 15 days."},
{s:"An activity has a latest finish LF = 20, an earliest start ES = 5 and a duration of 4.",q:"Using the maximum-float formula, what is the result?",o:["9.","11.","21.","29.","15."],a:1,e:"Max float = LF − ES − duration = 20 − 5 − 4 = 11."},
{s:"A project manager smooths out the period-to-period manpower requirements to remove peaks and valleys. As a result, the end date moves out and additional costs appear.",q:"Which network replanning technique is this, and what happens to the end date?",o:["Resource leveling; ideally the end date does not change, but in reality it moves out.","Resource allocation; the end date is fixed by the customer.","Resource leveling; the end date is always shortened.","Crashing; the end date never changes.","Resource allocation; the end date is always shortened because the critical path is recalculated."],a:0,e:"Resource leveling smooths manpower; ideally the end date stays, but in reality it often slips and costs rise."},
{s:"A project manager tries to find the shortest possible critical path based on a fixed number of available engineers, but finds that the engineers are not technically qualified to perform several different activities.",q:"Which technique is being applied, and what problem typically arises?",o:["GERT; looping and branching cannot be represented when the number of engineers is fixed.","Resource leveling; the customer's end date becomes unrealistic because the manpower peaks are smoothed.","Resource allocation; employees may not be qualified to work on more than one activity.","Resource leveling; the number of dummy activities increases.","Resource allocation; the critical path disappears."],a:2,e:"Resource allocation (limited resources) finds the shortest path with fixed resources; problem: people may not be qualified for several activities."},
{s:"A bidder believes that it has secret information about the customer's cost budget.",q:"Which statement about the availability of such information is correct?",o:["The customer must publish its budget in the request for proposal.","Only the lowest bidder has access to the customer's budget.","Information available to one bidder is generally available to all.","The proposal manager is prohibited from using such information.","Such information is available only to type II bidders."],a:2,e:"Kerzner: information available to one bidder is generally available to all."},
{s:"An estimator predicts the labor hours of the 20th unit of a device from the hours of the 10th unit, using the fact that hours fall by a constant percentage each time production doubles.",q:"Which type of cost estimating relationship is this?",o:["A cost-cost relationship.","A mathematical equation based on regression analysis.","A forward pricing rate for indirect costs.","A cost-noncost relationship based on physical characteristics.","A cost-quantity relationship such as a learning curve."],a:4,e:"Constant % reduction per doubling of quantity = learning curve, a cost-quantity relationship."},
{s:"A company follows the type I pricing strategy: it scrubs the baseline, adjusts for risks, adds the desired margin and compares the price with the customer budget.",q:"What is the final step of the type I strategy?",o:["Bid the most likely winning price or lower regardless of cost.","Explain to the customer where additional funding is coming from.","Decide whether a negative gross margin is acceptable.","Bid only if the price is within the competitive range.","Determine the should-cost including risk adjustments."],a:3,e:"Type I ends with: bid only if the price is within the competitive range."},
{s:"A company bids a price below its cost for a type II acquisition.",q:"According to the two global pricing strategies, what is the company often required to do in this case?",o:["Ask the line managers to inflate the direct labor hours.","Explain to the customer where the additional funding is coming from, such as company profits.","Increase the overhead rate to cover the loss.","Withdraw the bid immediately, because a negative gross margin is never allowed under either pricing strategy in the table.","Convert the acquisition to a type I program, add the desired margin and bid only if the price is within the competitive range."],a:1,e:"When bidding below cost, the company often must explain where the extra funding comes from (e.g., company profits)."},
{s:"A new project is similar to one completed last year. The estimating team has several weeks, uses a top-down approach, and expects an accuracy of −10% to +25%.",q:"Which estimating method and generic type from the standard estimating-method table is this?",o:["Parametric, rough order of magnitude.","Analogy, budget estimate.","Parametric, definitive estimate.","Engineering (grass roots), budget estimate.","Engineering (grass roots), definitive estimate."],a:1,e:"Analogy = budget estimate, top down, −10% to +25%, takes weeks."},
{s:"An estimate has an accuracy of plus or minus 20 to 25 percent.",q:"Which class of estimate is this according to the standard classes of estimates?",o:["Class II, capital cost.","Class V, feasibility.","Class VI, order of magnitude.","Class IV, appropriation.","Class I, definitive."],a:3,e:"Six-class table (accuracy widens with class number): I definitive ±5, II capital cost ±10–15, III appropriation w/ some capital cost ±15–20, IV appropriation ±20–25, V feasibility ±25–35, VI order of magnitude >±35. (Confirmed by Variant 4, Q42.)"},
{s:"An in-house project has reached the termination stage, and a major scope change has pushed the cost beyond the authorization range.",q:"What type of estimating is appropriate for this stage?",o:["Venture guidance or feasibility studies based on minimum-scope information for the evaluation of future work.","Reestimation for major scope changes or variances beyond the authorization range.","Estimating for authorization of partial or full funds.","A rough order of magnitude estimate prepared in days.","Estimating for detailed work of the main stage."],a:1,e:"Termination stage: reestimation for major scope changes or variances beyond the authorization range."},
{s:"The pricing process integrates the functional units into the project environment.",q:"Through what activity does this integration occur?",o:["Through the calculation of slack for every event.","Through the signing of the project charter by the sponsor.","Through the audit of the supporting data by the customer.","Through the pricing-out of the work breakdown structure.","Through the selection of the type of contract."],a:3,e:"Integration of functional units occurs through pricing out the WBS."},
{s:"A request for proposal requires all bids to be submitted in ten days. The proposal manager sets a tight schedule for the program office and the functional units.",q:"What does the RFP indirectly define in this situation?",o:["Which activities lie on the critical path.","Which department average salary must be used for billing.","The overhead rate for the proposal.","The class of estimate that the customer will accept.","How much time the pricing units have to justify labor costs."],a:4,e:"The RFP deadline indirectly limits how much time pricing units have to justify their labor costs."},
{s:"A pricing unit is expected to give an almost immediate response to a pricing request from the program office.",q:"Whose responsibility is it to maintain the standards that make this possible?",o:["The lowest pricing unit supervisors.","The proposal manager.","The capital market stakeholders.","The customer's auditors.","The executive sponsor."],a:0,e:"Kerzner: the lowest pricing unit supervisors must maintain the standards that allow almost immediate pricing response."},
{s:"A cost proposal lists building rent, cafeteria, payroll taxes, sick leave, vacation and utilities.",q:"How should these items be classified?",o:["Estimating pitfalls.","Supporting data from vendor quotes.","Elements of overhead rates.","Materials and support costs.","Direct labor costs."],a:2,e:"Rent, cafeteria, payroll taxes, leave, utilities = overhead rate elements."},
{s:"A company submits a sole-source proposal to a government customer.",q:"What is not uncommon on sole-source proposals?",o:["Pricing all work at the actual salaries of unidentified employees.","Omitting the supporting data because there are no competitors.","Having the supporting data audited before the proposal is submitted.","Using the department average salary to bill the customer.","Accepting a negative margin to penetrate a new market."],a:2,e:"On sole-source proposals it's not uncommon for the customer to audit the supporting data before submission."},
{s:"Work is priced at the department average salary, and all work performed is charged to the project at the department average, regardless of who does the work.",q:"What behavior does this billing method encourage?",o:["Functional managers refuse to release any employees.","Project managers avoid experienced employees, because their higher actual salaries would be billed to the project.","Project managers inflate the direct labor hours.","Project managers fight for the highest-salary resources, since only average wages are billed to the project.","Customers refuse to audit the supporting data."],a:3,e:"If only the average is billed, PMs want the most experienced (highest-paid) people at average cost."},
{s:"A project team misinterpreted the statement of work and applied junior skill levels to tasks that required senior engineers. The problems became visible only when the cost control system reported overruns.",q:"How are such problems best described?",o:["Purposes of network planning such as what-if exercises.","Estimating pitfalls, which often become evident only through the cost control system.","Consequences of poor planning such as wild enthusiasm, disillusionment and the search for the guilty.","Elements of overhead rates such as supervision.","Type II acquisition strategies that accept a negative margin in order to penetrate a new market segment."],a:1,e:"Misinterpreting the SOW and wrong skill levels are estimating pitfalls, often detected via the cost control system."},
{s:"A project manager wants to identify risks by probing and analyzing all data.",q:"Which of the following is a risk identification tool?",o:["The responsibility assignment matrix.","The dummy activity.","The learning curve.","Independent reviews and audits.","The department average salary."],a:3,e:"Risk identification tools include expert interviews, checklists, independent reviews and audits, etc."}
]},
{ id:"v3", name:"Variant 3", questions:[
{n:1,s:"A student is asked to give the short definition of a project.",q:"Which definition is correct?",o:["A temporary endeavor to create a unique product, service or result.","A contract between a buyer and a seller with a fixed price.","A permanent organizational unit created to deliver repeated services.","A set of policies and procedures for running a functional department.","A network of events and activities with a critical path."],a:0,e:"PMI's short definition: a temporary endeavor undertaken to create a unique product, service or result."},
{n:2,s:"An akimat launches a project to digitize archive documents. The project has a specific objective, a start date of 1 March and an end date of 31 August, but the akimat has not set any spending ceiling.",q:"According to the list of project characteristics, how should the missing spending ceiling be interpreted?",o:["The work becomes a project once the critical path is calculated.","Funding limits apply only 'if applicable', so the work can still be a project.","The work cannot be a project because every project must have a funding limit.","The work is not a project because it has a defined end date.","The work is a project only if the customer signs a fixed-price contract."],a:1,e:"Kerzner lists 'has funding limits (if applicable)', so a missing ceiling doesn't disqualify it."},
{n:3,s:"A project manager reports to the sponsor: 'All work has been verified as complete, the contract is closed, and the charge numbers are financially closed. Only the administrative paperwork remains.'",q:"Which process group is nearly finished?",o:["Planning.","Monitoring and control.","Closure.","Execution.","Initiation."],a:2,e:"Verification, contract/financial/administrative closure = closure process group."},
{n:4,s:"A company has high staff turnover, and managers worry that activities will be forgotten when people leave.",q:"Which potential benefit of project management addresses this concern?",o:["Guarantee of customer acceptance of all deliverables.","Removal of the need to negotiate for team members, because the line managers assign staff automatically to every project.","Elimination of project risks and changes in technology through the early identification of problems and corrective action.","Identification of functional responsibilities so that all activities are accounted for despite turnover.","Transfer of staffing decisions to the project manager."],a:3,e:"Benefit: identification of functional responsibilities to ensure all activities are accounted for, regardless of personnel turnover."},
{n:5,s:"During a three-year project the company changed its organizational structure twice, and the core technology of the product changed once.",q:"How should organizational restructuring and changes in technology be classified?",o:["As obstacles that must be overcome to achieve the benefits of project management.","As potential benefits of project management that improve estimating capability for future planning.","As criteria of project success.","As classical functions of management.","As capital market stakeholder requirements."],a:0,e:"Organizational restructuring and changes in technology are obstacles to achieving PM benefits."},
{n:6,s:"A student compares the list of classical management functions with the definition of project management and notices that four of the five functions appear in the definition.",q:"Why is the fifth function omitted?",o:["Because staffing is performed by the customer after acceptance.","Because staffing is part of the closure process group.","Because staffing is a line responsibility, not the project manager's.","Because controlling is done by capital market stakeholders.","Because directing is performed only by executives."],a:2,e:"Staffing is omitted from the PM definition because it is a line responsibility."},
{n:7,s:"A consulting project produces a feasibility study, a set of handouts and a documentation package for the customer.",q:"How should these deliverables be classified?",o:["Interim deliverables, because they are produced during a life-cycle phase.","Software deliverables, which are usually paper products such as reports, studies, handouts or documentation.","Hardware deliverables, such as a table, a prototype or a piece of equipment, because they are tangible outputs of the project.","Organizational deliverables, because they are given to line managers.","Capital market deliverables, because they are financial documents."],a:1,e:"Kerzner: software deliverables are usually paper products (reports, studies, handouts, documentation)."},
{n:8,s:"A student asks for the definition of stakeholders.",q:"Which definition is correct?",o:["Only the employees who report to the project manager.","Individuals or organizations that can be favorably or unfavorably impacted by the project.","Only the customers who accept the final deliverable.","Only the persons or organizations that provide money for the project, such as shareholders, creditors and banks.","Only the line managers who assign resources."],a:1,e:"Stakeholders: individuals or organizations that can be favorably or unfavorably impacted by the project."},
{n:9,s:"A construction project's suppliers and its customers are worried about delays.",q:"In the typical categorization, suppliers and customers belong to which stakeholder group?",o:["Product/market stakeholders.","Organizational stakeholders.","Line stakeholders.","Internal stakeholders.","Capital market stakeholders."],a:0,e:"Product/market stakeholders: customers, suppliers, local committees, government, public."},
{n:10,s:"A student is asked which stakeholder category is missing from the list: organizational stakeholders, product/market stakeholders.",q:"Which category completes the list?",o:["Functional stakeholders.","Line stakeholders.","Internal stakeholders.","Customer stakeholders.","Capital market stakeholders."],a:4,e:"The three categories: organizational, product/market, and capital market stakeholders (shareholders, creditors, banks)."},
{n:11,s:"To finish a project on time, the project manager pressured the line managers into working excessive overtime. The project finished on time and budget, but the relationship between the project manager and the line managers was damaged.",q:"Which criterion from the expanded definition of project success was violated?",o:["Completion within the budgeted cost.","Completion with acceptance by the customer or user.","Completion at the proper performance or specification level.","Completion without disturbing the corporate culture or destroying the working relationships.","Completion with minimum or mutually agreed upon scope changes."],a:3,e:"Damaging PM–line manager relationships violates 'without disturbing the corporate culture' / working relationships."},
{n:12,s:"A developer says: 'I report to the head of the software department for salary, career growth and technical standards, and at the same time I work on a project under the project manager.'",q:"Who does what in this project-line interface?",o:["The PM coordinates and integrates the project activities, while the line manager controls the technical personnel.","The PM hires and evaluates the developer, while the line manager sets the project schedule.","The line manager integrates the project activities, while the PM sets the technical standards.","The customer controls the technical personnel, while the PM approves salaries.","The sponsor controls the technical personnel, while the line manager writes the charter."],a:0,e:"PM: coordinates and integrates project activities. Line manager: staffs and controls technical personnel (salary, careers, standards)."},
{n:13,s:"A project manager complains that she lacks formal direct authority over functional department staff.",q:"What mechanism is essential to make project management work despite this?",o:["Transferring all functional staff to report directly to the project manager.","A signed contract between the project manager and each employee.","Escalating every resource decision to the executive officers.","Billing all functional work at actual salaries.","A good working relationship and daily focal-point interface between the PM and line managers."],a:4,e:"PM works through a good daily working relationship with line managers, not formal authority."},
{n:14,s:"A project manager ensures that all project activities are properly sequenced and directed toward meeting project objectives.",q:"What is this responsibility called?",o:["Resource leveling.","Interface management.","Line management.","Integration management.","Contractual closure."],a:3,e:"Making sure activities are properly sequenced and directed toward objectives = integration (integration management)."},
{n:15,s:"A manager claims that a project is 'successful' only if it is on time and within cost.",q:"Which additional element does the definition of successful project management include?",o:["The use of a rough order of magnitude estimate.","Acceptance by the customer.","Approval by the trade union.","The absence of any external dependencies.","A positive gross profit margin."],a:1,e:"Success = time, cost, performance/technology level, effective resource use, and acceptance by the customer."},
{n:16,s:"A student is asked for the general description of planning.",q:"Which description is correct?",o:["The function of billing labor hours back to the project at the actual salaries of the employees who performed the work.","The function of closing the contract and the charge numbers.","The function of calculating slack for every event in the network.","The function of auditing the supporting data and vendor quotes before the cost proposal is submitted to the customer.","Selecting the enterprise objectives and establishing the policies, procedures and programs to achieve them."],a:4,e:"Planning = selecting enterprise objectives and establishing policies, procedures and programs to achieve them."},
{n:17,s:"A task is well understood before it is performed.",q:"What is the consequence for planning?",o:["The task will always have negative slack.","The task must be estimated with a rough order of magnitude.","Much of the work can be preplanned.","The task must be placed on the critical path.","The task cannot be included in the charter."],a:2,e:"If a task is well understood beforehand, much of the work can be preplanned."},
{n:18,s:"A project manager states four qualities that project planning must have.",q:"Which set of qualities is correct?",o:["Contractual, priced, audited, and signed by the shareholders.","Optional, top-down, unreviewed, and limited to one functional unit.","Systematic, flexible, disciplined through reviews and controls, and open to multifunctional inputs.","Confidential, fixed once the charter is signed, delegated to the customer, and performed once at the start of the project.","Informal, rigid enough to prevent changes, undocumented, and performed only by the executive officers of the company."],a:2,e:"Planning must be systematic, flexible enough to handle unique activities, disciplined through reviews and controls, and capable of accepting multifunctional inputs."},
{n:19,s:"A team wants to reduce uncertainty, improve the efficiency of the operation and obtain a better understanding of the objectives.",q:"These three items are examples of which of the following?",o:["Consequences of poor planning.","Types of dependencies.","Purposes of planning.","Causes of negative slack.","Contents of the project charter."],a:2,e:"Purposes of planning: eliminate/reduce uncertainty, improve efficiency, better understanding of objectives, basis for monitoring and control."},
{n:20,s:"A plan shows when each group activity will be started and completed.",q:"Which of the nine planning components is this?",o:["Standard.","Forecast.","Budget.","Schedule.","Program."],a:3,e:"Start and completion dates of activities = schedule."},
{n:21,s:"A plan describes the strategy to be followed and the major actions to be taken in order to achieve the objectives.",q:"Which planning component is this?",o:["Organization.","Objective.","Policy.","Procedure.","Program."],a:4,e:"Strategy and major actions to achieve objectives = program."},
{n:22,s:"A plan contains a projection of the expected exchange rate and market demand at the end of the year.",q:"Which planning component is this?",o:["Budget.","Forecast.","Objective.","Standard.","Schedule."],a:1,e:"A projection of what will happen by a certain time = forecast."},
{n:23,s:"A student asks what the original concept behind the project charter was.",q:"Which statement is correct?",o:["To document the project manager's authority, especially for projects away from the home office.","To show the critical path to senior management.","To record the actual costs of the project so that the customer could audit them on a cost-reimbursable contract.","To list the elements of overhead rates for pricing.","To define the department average salary for billing."],a:0,e:"Originally the charter documented the PM's authority and responsibility, especially for projects off-site from the home office."},
{n:24,s:"A charter draft lists the project manager, the business purpose with assumptions and constraints, the project description, the objectives and the key stakeholders, but says nothing about what is excluded from the project.",q:"Which minimum charter element is missing?",o:["The spending plan (S-curve).","Resumes of key personnel.","The responsibility assignment matrix.","The change management plan.","Project scope (inclusions and exclusions)."],a:4,e:"The charter must define project scope, including what is in and what is excluded."},
{n:25,s:"A project manager lists the most common scheduling techniques.",q:"Which of the following lists only common scheduling techniques?",o:["Gantt or bar charts, milestone charts, line of balance, networks.","Line of balance, responsibility matrices, bills of materials, charge numbers.","Networks, decision support systems, expected value measures, audits.","Gantt charts, stakeholder maps, S-curves, overhead tables.","Milestone charts, cost models, learning curves, charters."],a:0,e:"Common scheduling techniques: Gantt/bar charts, milestone charts, line of balance, networks (PERT/ADM/PDM/GERT)."},
{n:26,s:"A project manager wants to answer the question 'What happens to the end date if activity D is delayed by two weeks?' using a picture of the whole program.",q:"Which item of management information obtainable from a network does this represent?",o:["Resource leveling.","Cost of a crash program.","'What if' exercises.","Forward pricing rates.","Evaluation of performance."],a:2,e:"Asking what happens if an activity slips is a 'what if' exercise, one of the outputs of network planning."},
{n:27,s:"A student reads the definition of an activity in a network.",q:"Which definition of an activity is correct?",o:["The difference between the latest and earliest dates.","A milestone indicating when work starts or finishes.","The longest path through the network.","The element of work that must be accomplished.","The total time required to complete the work."],a:3,e:"Activity = element of work that must be accomplished. Event = milestone; duration = total time."},
