{n:28,s:"A colleague says: 'The critical path is the shortest path through the network, so it shows the minimum project duration.'",q:"How should this statement be corrected?",o:["The critical path is the longest path; it determines the project duration, which is the shortest possible completion time.","The critical path is the shortest path through the network; it shows the maximum project duration and the latest possible end date.","The critical path is any path that contains a dummy activity.","The critical path is the cheapest path and shows the minimum project cost.","The critical path is the path with the most slack through the network; it shows the average duration of all possible paths."],a:0,e:"The critical path is the longest path; its length is the shortest possible project completion time."},
{n:29,s:"In a PERT network, three circles labelled '31', '18' and '7' all have arrows pointing into one circle labelled '26'.",q:"What is the circle labelled '26' called?",o:["A dummy activity.","A sink.","A discretionary dependency.","A burst point.","A milestone chart."],a:1,e:"Several activities converging into one event = sink. Several leaving = burst point."},
{n:30,s:"Event 2 of a network has TE = 3 and TL = 3. Event 3 has TE = 2 and TL = 5.",q:"What are the slack times of events 2 and 3?",o:["Event 2: 0; event 3: 3.","Event 2: 3; event 3: 0.","Event 2: 3; event 3: 3.","Event 2: 6; event 3: 7.","Event 2: 0; event 3: 7."],a:0,e:"Slack = TL − TE: event 2 = 3 − 3 = 0; event 3 = 5 − 2 = 3."},
{n:31,s:"A network has three paths: P1 = 2 + 5 + 5 = 12 days, P2 = 3 + 7 + 5 = 15 days, P3 = 3 + 3 + 6 = 12 days.",q:"By how many days can activities on path P1 slip in total without delaying the project?",o:["15 days.","3 days.","27 days.","0 days.","12 days."],a:1,e:"Critical path = P2 (15). P1 slack = 15 − 12 = 3 days."},
{n:32,s:"A student learns the four values used to make full use of PERT/CPM.",q:"Which of the following correctly names one of these values?",o:["LF, the longest path through the network.","LS, the latest time when an activity can finish.","ES, the earliest time when an activity can finish.","EF, the earliest time when an activity can start.","LS, the latest time when an activity can start."],a:4,e:"ES = earliest start, EF = earliest finish, LS = latest start, LF = latest finish. Only E matches its definition."},
{n:33,s:"Halfway through a project, two activities slipped and the assigned programmers turned out not to have the required skill levels. The backward pass, measured from the customer's completion date, now gives negative slack.",q:"Which of the following is also a typical cause of negative slack?",o:["The network contained a dummy activity.","The proposal manager set a tight proposal schedule.","A discretionary dependency was used.","The project charter was signed by the sponsor.","The original plan was highly optimistic but unrealistic."],a:4,e:"Causes of negative slack: activity slippage, wrong skill levels, and an original plan that was highly optimistic but unrealistic."},
{n:34,s:"An activity has an earliest start ES = 4, a latest finish LF = 12 and a duration of 3.",q:"What is its maximum float?",o:["8.","9.","13.","19.","5."],a:4,e:"Max float = LF − ES − duration = 12 − 4 − 3 = 5."},
{n:35,s:"A project manager wants to smooth manpower requirements without changing the project end date.",q:"Which statement about achieving this ideal situation with resource leveling is correct?",o:["It is impossible because leveling always shortens the critical path.","It is always achieved, because leveling only changes the resource profile and never affects the end date or the costs.","It requires the customer to accept negative slack.","It is the ideal situation, but in reality the end date moves out and additional costs are incurred.","It is achieved by adding dummy activities to the network."],a:3,e:"Ideally leveling keeps the end date, but in reality it moves out and extra costs appear."},
{n:36,s:"An estimator predicts the cost of a server room from its floor area in square meters and its required cooling capacity.",q:"Which type of cost estimating relationship is this?",o:["A department average salary relationship.","A buy-in decision based on follow-on contracts.","A cost-quantity relationship such as a learning curve, in which unit cost falls as the number of units produced increases.","A cost-noncost relationship based on physical characteristics, technical parameters or performance characteristics.","A cost-cost relationship, in which one cost element is estimated as a proportion of another cost element."],a:3,e:"Cost estimated from physical/technical parameters (area, cooling capacity) = cost-noncost relationship."},
{n:37,s:"A company sees a tender as a planned penetration into a new market and is willing to perform well in place of making a profit.",q:"How should this acquisition be classified, and what is its objective?",o:["Type II acquisition; the objective is to win and perform well to gain a foothold in a new market.","Type II acquisition; the objective is to maximize profit on a one-of-a-kind program.","Neither type; pricing strategies cannot be classified by follow-on potential.","Type I acquisition; the objective is to win the program and execute it profitably according to the contractual agreements.","Type I acquisition; the objective is to bid only within the competitive range."],a:0,e:"Type II (planned market penetration): win and perform well to gain a foothold, even without profit."},
{n:38,s:"In both global pricing strategies, the company must 'scrub the baseline'.",q:"What does this step mean?",o:["Sign the project charter.","Add the desired margin to the price.","Audit the customer's budget.","Squeeze out unnecessary costs.","Calculate the slack for each activity."],a:3,e:"Scrubbing the baseline = squeezing out unnecessary costs."},
{n:39,s:"An estimator collects recent experience in similar work, market and industry surveys, and knowledge of the operations and processes.",q:"When should this information be collected?",o:["Only at the termination stage of the project.","After the customer has audited the proposal.","Prior to the initiation of the estimating process.","Only when the contract is cost-reimbursable.","After the price has been submitted to the customer."],a:2,e:"This information is collected prior to starting the estimating process."},
{n:40,s:"A project office has only a few days to prepare an estimate for a top-down evaluation of a new idea.",q:"According to the standard estimating-method table, which accuracy range should the customer expect from this estimate?",o:["Plus or minus 5%.","−25% to +75%.","−10% to +25%.","−5% to +10%.","Plus or minus 10 to 15%."],a:1,e:"Days + top-down = parametric ROM, −25% to +75%."},
{n:41,s:"An estimate has an accuracy of plus or minus 25 to 35 percent.",q:"Which class of estimate is this according to the standard classes of estimates?",o:["Class VI, order of magnitude.","Class I, definitive.","Class V, feasibility.","Class IV, appropriation.","Class III, appropriation with some capital cost."],a:2,e:"Six-class table (accuracy widens with class number): I definitive ±5, II capital cost ±10–15, III appropriation w/ some capital cost ±15–20, IV appropriation ±20–25, V feasibility ±25–35, VI order of magnitude >±35. (Confirmed by Variant 4, Q42.)"},
{n:42,s:"An in-house project is at the planning stage; the company needs an estimate to authorize partial or full funds.",q:"On what is this estimate based?",o:["Minimum-scope information.","Preliminary design and scope.","Detailed work of the main stage.","Historical data traceable by charge numbers.","Variances beyond the authorization range."],a:1,e:"Planning stage (authorization of partial/full funds) estimates are based on preliminary design and scope."},
{n:43,s:"The pricing process develops the work breakdown structure and the activity schedules.",q:"Whose responsibility is the development of these two tools?",o:["The proposal manager, with input from the shareholders.","The customer, with input from its auditors.","The lowest pricing unit supervisors alone.","The program office, with input from the functional units.","The functional units alone, without the program office."],a:3,e:"The WBS and activity schedules are developed by the program office with functional unit input."},
{n:44,s:"A request for proposal requires an almost immediate response.",q:"What may such a proposal permit regarding labor justification?",o:["Vendors are not allowed to include labor costs at all.","Vendors must price all labor at the department average salary.","Vendors must obtain the customer's audit before bidding.","Vendors must submit comprehensive labor justification with the bid.","Vendors may be permitted to submit labor justification at a later date."],a:4,e:"With an almost immediate response required, vendors may be allowed to submit labor justification later."},
{n:45,s:"Management is forced to reduce the man-hours submitted by functional units.",q:"What are the two usual reasons for such reductions?",o:["A change in the corporate culture, or a change in technology.","The customer's audit, or the sponsor's signature on the charter.","A negative slack in the network, or a missing dummy activity.","Insufficient funding, or the need to remain competitive.","An external dependency, or a discretionary dependency."],a:3,e:"Man-hours are usually cut due to insufficient funding or the need to remain competitive."},
{n:46,s:"A company builds its supporting data for a proposal from internal historical records.",q:"What requirements apply to such internal data?",o:["They must be based on external subcontractor or vendor quotes only, because internal records are not accepted as support.","They must be based on continually updated historical data, traceable by itemized charge numbers.","They must be based on the customer's budget and competitive information and kept confidential from the customer's auditors.","They must be estimated at the department average salary.","They must be prepared only for fixed-price contracts."],a:1,e:"Internal supporting data must come from continually updated historical data traceable by itemized charge numbers."},
{n:47,s:"A proposal manager wants to win a job and proposes a very low price, although the company's long-range objectives are market penetration and new product development.",q:"Which statement about this approach is correct?",o:["A very low price is always the correct strategy for type I acquisitions, because such programs have no follow-on business.","The low price is acceptable if it is billed at the department average salary.","Winning is only the beginning; the company's objectives may be incompatible with or irrelevant to a low-price strategy.","The low price guarantees follow-on contracts and bail-out changes.","The low price reduces the accuracy class of the estimate to Class I."],a:2,e:"Winning is only the beginning; a low price may not fit the company's long-range objectives."},
{n:48,s:"Work is priced at the department average salary, but billed back to the project at the actual salaries of the employees who perform it. The project manager insists on using only the best, highest-paid employees.",q:"What is the consequence?",o:["The customer will lose the right to audit the books.","The functional managers will be required to inflate the hours.","The project will automatically receive a Class I estimate.","A cost overrun, unless these employees work faster.","A cost underrun will occur because average wages are billed."],a:3,e:"Priced at average but billed at actual high salaries → cost overrun unless the expensive people finish faster."},
{n:49,s:"A project manager lists risks that are common to many projects.",q:"Which of the following is a common project risk?",o:["Preparation of the charter by the project manager.","Use of a dummy activity in the network.","Reporting horizontally to a project manager.","Use of the analogy estimating method.","Lack of management support."],a:4,e:"Lack of management support is a commonly cited project risk."},
{n:50,s:"A project manager has identified, quantified and prioritized the risks and developed a strategy for managing them.",q:"According to the six-step risk management process, which two steps remain?",o:["Project sponsor/executive review, and taking action.","Auditing the supporting data, and submitting the proposal.","Calculating slack, and identifying the critical path.","Resource leveling, and resource allocation.","Signing the charter, and pricing out the WBS."],a:0,e:"Six steps: identify → quantify → prioritize → develop strategy → sponsor/executive review → take action."}
]},
{ id:"v4", name:"Variant 4", questions:[
{s:"A logistics company runs the following: (1) daily truck maintenance, (2) the launch of a new tracking app with a fixed deadline and budget, (3) monthly payroll processing.",q:"Which of these is a project?",o:["Only (2) and (3), because both have deadlines and budgets.","Only (2), because it is temporary and creates a unique result.","Only (3), because payroll has a funding limit.","Only (1), because maintenance consumes equipment and people.","All three, because each consumes human and nonhuman resources."],a:1,e:"Only the app launch is temporary and unique; maintenance and payroll are repetitive operations."},
{s:"A student lists the five process groups of project management.",q:"Which list is correct?",o:["Initiation, planning, execution, monitoring and control, closure.","Identification, quantification, prioritization, review, action.","Initiation, estimating, pricing, auditing, closure.","Planning, organizing, staffing, controlling, directing.","Conceptual, planning, main, termination, closure."],a:0,e:"Five process groups: initiation, planning, execution, monitoring and control, closure."},
{s:"A ministry has three candidate projects but budget for only one. A committee compares their benefits and selects one, then prepares the document that formally sanctions it.",q:"Which process group is the committee performing?",o:["Initiation.","Closure.","Execution.","Planning.","Monitoring and control."],a:0,e:"Selecting the project, recognizing benefits and preparing sanction documents = initiation."},
{s:"A project manager notices that the actual cost of a work package is 20 percent higher than predicted, analyzes the impact and reassigns two engineers.",q:"Which process group do these actions belong to?",o:["Planning.","Monitoring and control.","Closure.","Initiation.","Execution."],a:1,e:"Comparing actual vs. predicted, analyzing impact and adjusting = monitoring and control."},
{s:"A project was delivered at the specified performance level, accepted by the customer and used its resources efficiently, but it finished four months after the planned end date and cost 30 percent more than budgeted.",q:"According to the definition of successful project management, how many of the five elements were NOT achieved?",o:["None, because the customer accepted the result.","One: within time only.","One: within cost only.","Two: within time and within cost.","Three: within time, within cost and customer acceptance."],a:3,e:"Five elements: time, cost, performance, resource use, acceptance. Time and cost were missed → two."},
{s:"A project sponsor asks how project management helps with trade-offs between time, cost and performance.",q:"Which potential benefit answers this question?",o:["Guarantee of a positive gross margin.","Removal of the customer's special requirements.","A methodology for trade-off analysis.","Transfer of staffing to the project manager.","Elimination of all project risks."],a:2,e:"One listed benefit: a methodology for trade-off analysis."},
{s:"A company must price a project two years before the work begins, in an environment where technology changes quickly.",q:"Which obstacles does this situation illustrate?",o:["Vertical reporting, and horizontal reporting.","Early identification of problems, and improved estimating capability.","Forward planning and pricing, and changes in technology.","Minimizing the need for continuous reporting, and measurement against plans.","Hardware deliverables, and interim deliverables."],a:2,e:"Pricing years ahead = forward planning and pricing; fast tech change = changes in technology. Both are obstacles."},
{s:"A student reads that project management uses the systems approach.",q:"According to the definition of project management, for what kind of objective are company resources planned, organized, directed and controlled in project management?",o:["A permanent objective of maintaining the functional departments and their vertical hierarchy.","An objective set by the trade union for its members.","A relatively short-term objective established to complete specific goals and objectives.","A long-term objective of increasing the company's share price.","An objective defined by the government for the general public."],a:2,e:"PM: planning, organizing, directing and controlling resources for a relatively short-term objective established to complete specific goals."},
{s:"A new project manager asks the head of the network department for a specific engineer, Aigerim. The department head assigns a different engineer instead.",q:"What are the project manager's rights in this situation?",o:["The project manager has no right to request resources; only the sponsor may do so.","The project manager may request specific resources, but the line manager decides.","The project manager has the right to overrule the line manager because the project is multifunctional.","The project manager may transfer the department head to another project.","The project manager may hire Aigerim directly from outside the company."],a:1,e:"The PM may request specific resources, but the final decision rests with the line manager."},
{s:"A student is asked for the definition of deliverables.",q:"Which definition is correct?",o:["The difference between the latest and earliest event dates.","Individuals or organizations that can be favorably or unfavorably impacted by the project.","The elements of overhead rates applied to labor.","Measurable, tangible outputs that are the end result of a project or a life-cycle phase.","Planned expenditures required to achieve or exceed the objectives of the project within the schedule."],a:3,e:"Deliverables: measurable, tangible outputs, the end result of the project or a life-cycle phase."},
{s:"A company applies the typical stakeholder categorization to a new project. It identifies its own executive officers and employees, its customers and suppliers, and its shareholders and creditors.",q:"Which three categories has it used, in the same order?",o:["Capital market, organizational, product/market.","Product/market, capital market, organizational.","Organizational, product/market, capital market.","Vertical, horizontal, diagonal.","Internal, external, financial."],a:2,e:"Executives/employees = organizational; customers/suppliers = product/market; shareholders/creditors = capital market."},
{s:"A public project was finished within time and cost and at the required performance, but the users refuse to sign the acceptance document because the interface is not what they expected.",q:"Which criterion of project success is unmet?",o:["Completion without changing the corporate culture.","Acceptance by the customer/user.","Utilizing the assigned resources efficiently.","Completion with minimum scope changes.","Completion without disturbing the main work flow."],a:1,e:"Users refuse to sign → acceptance by the customer/user not achieved."},
{s:"A project manager describes the resources that must be negotiated with line managers, including facilities and information/technology.",q:"Which of the following is also a resource in the project manager – line manager interface?",o:["Policies.","Shareholders.","Estimates.","Materials.","Charters."],a:3,e:"Interface resources: money, manpower, equipment, facilities, materials, information/technology."},
{s:"A project manager spends a day resolving a disagreement between the project team and the finance department, and then meets senior management to align priorities.",q:"Which two interface-management relationships is the project manager handling?",o:["Between the sponsor and the customer, and between two competing bidders.","Within the project team, and between the customer and its creditors.","Between the line managers and the general public, and within the finance department.","Between the shareholders and the banks, and between the unions and the public.","Between the team and the functional organizations, and with senior management."],a:4,e:"Team ↔ functional organization (finance) and team ↔ senior management are interface-management relationships."},
{s:"Project managers often know more about a company than most executives.",q:"What is the consequence?",o:["Project managers should be excluded from the capital market stakeholders.","Project managers should sign all contracts with customers.","Project managers should be paid at the department average salary.","Project management is a training ground for future general managers.","Project managers should replace line managers in staffing decisions."],a:3,e:"Because PMs learn the total operation of the company, PM is a training ground for future general managers."},
{s:"A student asks what kind of planning almost all projects require and why.",q:"Which statement is correct?",o:["Planning only at closure, because the results are known then.","Formal, detailed planning, because of their short duration and prioritized control of resources.","Planning only by the customer, because the customer pays for the work.","No planning, because the charter replaces the plan.","Informal planning, because projects are usually long and their resources are not shared with other work."],a:1,e:"Kerzner: almost all projects need formal, detailed planning due to short duration and prioritized control of resources."},
{s:"A project manager wants every participant to be able to identify the work required of them.",q:"What is one of the objectives of project planning that supports this?",o:["To assign all work to the project manager alone.","To limit the plan to the activities on the critical path.","To keep the details of the work within the project office, so that the functional units receive only summary information.","To completely define all work required so that it is readily identifiable to each participant.","To postpone the definition of work until execution, when more knowledge is gained and priorities become clear."],a:3,e:"A planning objective: completely define all work so it is readily identifiable to each participant."},
{s:"A team starts a project with wild enthusiasm and no defined requirements.",q:"What typically follows?",o:["Vertical reporting, horizontal reporting and interface management.","Identification, quantification and prioritization of risks.","Disillusionment, chaos, search for the guilty, punishment of the innocent and promotion of the nonparticipants.","Resource leveling, resource allocation and a shorter critical path.","A definitive estimate, a signed charter, an audited proposal and a commitment from the performing organizations."],a:2,e:"The classic consequences of poor planning."},
{s:"A plan states the planned expenditures required to achieve the objectives of the project.",q:"Which of the nine planning components is this?",o:["Standard.","Forecast.","Program.","Schedule.","Budget."],a:4,e:"Planned expenditures to achieve objectives = budget."},
{s:"A department has a rule: 'Suppliers are selected by competitive tender.' A separate document describes step by step how a tender is announced, evaluated and awarded.",q:"How should the rule and the step-by-step document be classified?",o:["The rule is a procedure; the step-by-step document is a policy.","The rule is an objective; the step-by-step document is a budget.","The rule is a standard; the step-by-step document is a forecast.","The rule is a policy; the step-by-step document is a procedure.","The rule is a program; the step-by-step document is an organization."],a:3,e:"General guide = policy; detailed method of carrying out the policy = procedure."},
{s:"A student summarizes the short definition of planning.",q:"Which summary is correct?",o:["Determining the overhead rate of each department.","Determining the customer's right to audit.","Determining what needs to be done, by whom, and by when.","Determining who will be blamed, who will be punished and who will be promoted if the project fails.","Determining the price that will win the job and the margin that the company is willing to accept."],a:2,e:"Planning: determining what needs to be done, by whom, and by when."},
{s:"A charter includes the business purpose of the project, the description, the objectives and constraints, the scope, the key stakeholders and their roles, and the risks.",q:"What must the charter also identify at a minimum?",o:["The elements of the overhead rate.","The project manager and his or her authority.","The department average salary of each functional unit.","The latest finish time of every activity.","The class of estimate used in the proposal."],a:1,e:"Minimum charter content includes identifying the PM and their authority."},
{s:"A company's detailed charter contains a spending plan and template levels of the WBS.",q:"What is the spending plan called in the detailed charter?",o:["The line of balance.","The learning curve.","The Gantt chart.","The critical path.","The S-curve."],a:4,e:"The spending plan in a detailed charter is the S-curve."},
{s:"A project manager needs to show the customer a simple picture of when each activity starts and ends, using horizontal bars against a time axis.",q:"Which scheduling technique is this?",o:["GERT.","Precedence Diagram Method.","Line of balance.","Gantt or bar chart.","PERT network."],a:3,e:"Horizontal bars against time = Gantt (bar) chart."},
{s:"A project manager converts a Gantt chart into a PERT chart by adding arrows that show which activities must precede others.",q:"What information, missing from the bar chart, does the network add?",o:["Interdependencies of activities.","The class of the estimate.","The overhead rate.","The elements of the charter.","The department average salary."],a:0,e:"Networks show the interdependencies of activities, which bar charts lack."},
{s:"A student reads the definition of duration in a network.",q:"Which definition is correct?",o:["The amount of work actually performed within the activity.","The total time required to complete the activity.","The difference between the latest and earliest event dates.","The longest path through the network.","A milestone showing when the activity starts."],a:1,e:"Duration = total time to complete the activity. Effort = work actually performed; slack = TL − TE."},
{s:"An activity on the critical path slips by two days. The project manager hopes that the delay can be recovered.",q:"Where can such a slippage be recovered so that the end date does not move?",o:["During the upstream events on the critical path.","During any of the downstream events on the critical path.","By moving the event to a burst point.","During events on a non-critical path with positive slack.","By adding a dummy activity to the network."],a:1,e:"Critical path slippage delays the end date unless recovered during downstream critical-path events."},
{s:"A project has three possible outcomes after a prototype test: proceed to production, redesign and retest, or cancel the product. The project manager needs a network that can show these multiple end results.",q:"Which technique is appropriate and why?",o:["PERT, because it shows the earliest and latest event times.","A milestone chart, because it shows the outcomes as events.","ADM, because it is also called the Critical Path Method.","Line of balance, because it handles repeated tests.","GERT, because it allows branching and multiple end results."],a:4,e:"GERT allows looping, branching and multiple end results."},
{s:"For each pair of statements, a student must identify the dependency type: (1) the foundation must be poured before the walls are built; (2) a government agency must issue a permit before construction starts, and the agency's timing is outside the project's control.",q:"Which pair of dependency types is correct?",o:["(1) external; (2) mandatory.","(1) mandatory; (2) discretionary.","(1) mandatory; (2) external.","(1) external; (2) discretionary.","(1) discretionary; (2) mandatory."],a:2,e:"Physical necessity = mandatory; outside party controls timing = external."},
{s:"A student studies the nomenclature used to define slack.",q:"What does TL represent?",o:["The latest date on which an event can take place without extending the completion date of the project.","The time at which the customer signs the charter.","The earliest time on which an event can be expected to take place after all preceding activities are finished.","The total labor hours of the activity.","The duration of the longest activity in the network."],a:0,e:"TL = latest allowable date for an event without extending the project. Option C describes TE."},
{s:"Event 6 is the final event of a network with TE = 15 and TL = 15. Event 4 has TE = 6 and TL = 9.",q:"What is the slack of each event, and what does the result mean for event 6?",o:["Event 4: 15; event 6: 0, so event 6 can be delayed.","Event 4: 0; event 6: 3, so event 4 lies on the critical path.","Event 4: 9; event 6: 30, so neither is critical.","Event 4: 3; event 6: 0, so event 6 lies on the critical path.","Event 4: 3; event 6: 15, so event 6 has the most slack."],a:3,e:"Event 4: 9 − 6 = 3; event 6: 15 − 15 = 0 → on the critical path."},
{s:"A network has paths P1 = 4 + 4 + 2 = 10 days, P2 = 4 + 6 + 2 = 12 days and P3 = 5 + 3 + 2 = 10 days. Activity on P2 with a duration of 6 days is delayed by 1 day.",q:"What is the new project duration?",o:["13 days.","10 days.","11 days.","14 days.","12 days."],a:0,e:"P2 is critical (12). Delaying it by 1 day → 13 days."},
{s:"An activity has an earliest start of day 3, an earliest finish of day 8, a latest start of day 3 and a latest finish of day 8.",q:"What does the slack calculation tell the project manager about this activity?",o:["Its slack is zero, so it is on the critical path.","Its slack is negative, so the customer's end date is unrealistic.","Its slack is 3, so it is a discretionary dependency.","Its slack is 8, so it has the most float in the network.","Its slack is 5, so it can be delayed by five days."],a:0,e:"LS − ES = 3 − 3 = 0 (LF − EF = 0) → critical."},
{s:"Activity K has an earliest start of 6, a latest finish of 18 and a duration of 5.",q:"What is its maximum float?",o:["19.","7.","29.","13.","12."],a:1,e:"Max float = LF − ES − duration = 18 − 6 − 5 = 7."},
{s:"Two project managers argue. One says resource leveling finds the shortest critical path for a fixed number of people; the other says resource allocation smooths out manpower peaks and valleys.",q:"Who is right?",o:["Neither: leveling smooths peaks and valleys; allocation seeks the shortest critical path.","Only the second is right; resource leveling is not a replanning technique.","Only the first is right; resource allocation is not a network replanning technique but a pricing activity.","Both are right; the two terms are interchangeable names for the same resource-based replanning technique.","Neither; both techniques are based on cost rather than resources."],a:0,e:"They swapped the definitions: leveling smooths manpower; allocation finds the shortest path with fixed resources."},
{s:"A student asks how estimates should be characterized.",q:"Which characterization is correct?",o:["Well-thought-out decisions based on the best available information, a CER or a cost model.","Guesses made by the proposal manager on the day of submittal, without any supporting data or cost model.","Values set by the customer's auditors.","Fixed numbers taken from the charter.","Blind luck based on the customer's budget and on whatever competitive information happens to be available."],a:0,e:"Estimates should be well-thought-out decisions based on the best available info, a CER or a cost model."},
{s:"An estimator predicts the cost of testing as a fixed percentage of the cost of development.",q:"Which type of cost estimating relationship is this?",o:["A cost-noncost relationship based on performance characteristics.","A learning curve.","A forward pricing rate.","A cost-cost relationship.","A cost-quantity relationship."],a:3,e:"One cost element as a proportion of another = cost-cost relationship."},
{s:"For a type II acquisition, a company compares its final cost estimate to the customer budget and the 'most likely' winning price, and then determines the gross profit margin necessary for a winning proposal.",q:"According to the two global pricing strategies, what must the company then decide?",o:["Whether to use the department average salary for billing.","Whether to convert the acquisition into a type I program.","Whether to bid only if the price is within the competitive range.","Whether the customer has the right to audit the books.","Whether the gross margin is acceptable given the must-win desire."],a:4,e:"Type II: decide whether the (possibly negative) margin is acceptable given the desire to win."},
{s:"In a type I acquisition, after estimating cost realistically for minimum requirements and scrubbing the baseline, the company determines the realistic minimum cost.",q:"According to the two global pricing strategies, what must be obtained at this step?",o:["The customer's signature on the charter.","The overhead rate elements.","Commitment of the performing organizations.","An explanation of the funding source.","A negative gross margin approval."],a:2,e:"Type I: determine realistic minimum cost and obtain commitment of the performing organizations."},
{s:"An estimate was prepared bottom-up over several months using the engineering (grass roots) method.",q:"According to the standard estimating-method table, what generic type of estimate is this and what is its accuracy?",o:["Budget, −5% to +10%.","Definitive, −25% to +75%.","Rough order of magnitude, −25% to +75%.","Budget, −10% to +25%.","Definitive, −5% to +10%."],a:4,e:"Engineering (grass roots), bottom up, months = definitive, −5% to +10%."},
{s:"An estimate has an accuracy worse than plus or minus 35 percent.",q:"Which class of estimate is this according to the standard classes of estimates?",o:["Class III, appropriation with some capital cost.","Class I, definitive.","Class VI, order of magnitude.","Class II, capital cost.","Class V, feasibility."],a:2,e:"Worse than ±35% = Class VI, order of magnitude."},
{s:"A customer requires a capital cost estimate.",q:"According to the standard classes of estimates, which class and accuracy correspond to a capital cost estimate?",o:["Class II, plus or minus 10 to 15 percent.","Class I, plus or minus 5 percent.","Class III, plus or minus 15 to 20 percent.","Class IV, plus or minus 20 to 25 percent.","Class VI, more than plus or minus 35 percent."],a:0,e:"Capital cost = Class II, ±10–15%. (This question also confirms the full table: III ±15–20, IV ±20–25, V ±25–35, VI > ±35.)"},
{s:"During competitive bidding, the estimating team wants to use a rough order of magnitude estimate, but the customer's RFP asks for a definitive estimate.",q:"Which statement about the type of estimate in competitive bidding is correct?",o:["The type of estimate depends on the department average salary.","The bidder may choose any type of estimate it prefers.","Only rough order of magnitude estimates are allowed in bidding.","The estimate type must match the customer's requirements.","The type of estimate is set by the proposal manager's schedule."],a:3,e:"In competitive bidding the type of estimate must satisfy the customer's requirements."},
{s:"During the pricing activities, a functional unit believes that the activity schedule for its work is unrealistic.",q:"What option does the functional unit have?",o:["Consulting program management about possible changes in the activity schedules and the work breakdown structure.","Changing the customer's end date without consulting the program office, because the functional unit owns the schedule.","Billing the work at actual salaries instead of the average.","Refusing to submit any pricing information until the program office rewrites the work breakdown structure.","Signing the charter in place of the sponsor."],a:0,e:"Functional units may consult program management about changes to the schedules and the WBS."},
{s:"A program manager schedules the kickoff meeting for pricing.",q:"Who must be present at the first meeting?",o:["Only the lowest pricing unit supervisors.","Only the capital market stakeholders.","Only the proposal manager.","Only the executive sponsor and the customer.","All pricing or labor-costing representatives."],a:4,e:"All pricing or labor-costing representatives must attend the kickoff."},
{s:"A company's program team members are frequently promoted from within the functional ranks.",q:"Which reason explains this practice?",o:["Functional employees have the right to sign the project charter on behalf of the sponsor and to approve the scope baseline.","Team members who know the departmental man-hour standards create trust, so that man-hours can be reduced fairly.","Functional employees are cheaper for the project, because their work is always billed back at the department average wage.","Functional employees can audit the supporting data for the customer.","Functional employees always have positive slack in the network."],a:1,e:"People who know departmental man-hour standards build trust in negotiations over man-hours."},
{s:"Government agencies force a company to bill actual salaries on a short-duration project on which only higher-salaried employees can be used.",q:"What is a common practice in such cases?",o:["To ask the customer to sign the charter.","To price the project as a type II acquisition with a negative margin.","To remove the supporting data from the proposal.","To reclassify the estimate as order of magnitude.","To 'inflate' the direct labor hours to cover the added costs."],a:4,e:"Kerzner: in such cases it is common to 'inflate' the direct labor hours to cover the added costs."},
{s:"A company prices its project office staff at their actual salaries, because these people are identified early, while functional employees are priced at the department average.",q:"How is this approach best described?",o:["A type I pricing strategy applied to a type II acquisition.","A violation of government pricing requirements.","An estimating pitfall caused by failure to use forward pricing rates for overhead, general and administrative costs.","A buy-in decision based on the assumption that bail-out changes and follow-on contracts will recover the loss.","A combination of the three billing methods, with the project office priced by the third method."],a:4,e:"Kerzner's third method combines the first two: project office at actual salaries, functional employees at department average."},
{s:"A project manager reviews the list of estimating pitfalls.",q:"Which of the following is an estimating pitfall?",o:["Use of a discretionary dependency in the network.","Reporting vertically to a line manager.","Failure to account for cost escalation and inflation.","Use of a milestone chart instead of a network.","Preparation of the charter for the sponsor's signature."],a:2,e:"Failure to account for cost escalation and inflation is a listed estimating pitfall."},
{s:"A student is asked for the definition of risk.",q:"Which definition is correct?",o:["The difference between the latest allowable date and the earliest expected date of an event in the network.","The margin added to the realistic minimum cost after the baseline has been scrubbed and adjusted for uncertainty.","The set of individuals or organizations that can be favorably or unfavorably impacted by the project.","The list of overhead elements in a cost proposal.","Factors that, if they occur, increase the probability that the time, cost and performance goals will not be met."],a:4,e:"Risk: factors that, if they occur, increase the probability that time, cost and performance goals won't be met."}
]}
];
/* ========================================================== */

const L = ["A","B","C","D","E","F"];
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let vi = 0, state, order = [], pos = 0;

function key(){return "pmquiz:"+VARIANTS[vi].id}
function load(){
  state = store.get(key()) || {answers:{}, shuffle:false, wrongOnly:false};
  buildOrder(); pos = 0;
}
function save(){store.set(key(),state)}
function qs(){return VARIANTS[vi].questions}
function num(i){return qs()[i].n||i+1}
function buildOrder(){
  let idx = qs().map((_,i)=>i);
  if(state.wrongOnly){ idx = idx.filter(i=>state.answers[i]!==undefined && state.answers[i]!==qs()[i].a); }
  if(state.shuffle){ for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]} }
  order = idx;
}

function renderVariants(){
  const el = document.getElementById("variants");
  el.innerHTML = "";
  VARIANTS.forEach((v,i)=>{
    const b=document.createElement("button");
    b.textContent=v.name; b.setAttribute("aria-pressed",i===vi);
    b.onclick=()=>{vi=i;load();renderAll()};
    el.appendChild(b);
  });
}
function stats(){
  let ok=0,bad=0; const n=qs().length;
  for(const [i,a] of Object.entries(state.answers)){ a===qs()[i].a?ok++:bad++; }
  return {ok,bad,n};
}
function renderBar(){
  const {ok,bad,n}=stats();
  document.getElementById("score").innerHTML = `${ok} correct <small>· ${bad} wrong · ${n-ok-bad} left</small>`;
  const p=document.getElementById("progress").children;
  p[0].style.width=(ok/n*100)+"%"; p[1].style.width=(bad/n*100)+"%";
  document.getElementById("btnShuffle").setAttribute("aria-pressed",state.shuffle);
  document.getElementById("btnWrong").setAttribute("aria-pressed",state.wrongOnly);
}
function renderGrid(){
  const g=document.getElementById("grid"); g.innerHTML="";
  order.forEach((qi,p)=>{
    const b=document.createElement("button");
    b.textContent=num(qi);
    const a=state.answers[qi];
    if(a!==undefined) b.className = a===qs()[qi].a?"ok":"bad";
    if(p===pos) b.classList.add("cur");
    b.setAttribute("aria-label","Question "+num(qi));
    b.onclick=()=>{pos=p;renderAll()};
    g.appendChild(b);
  });
}
function renderCard(){
  const c=document.getElementById("card");
  if(!order.length){
    c.innerHTML=`<div class="done"><div class="big">0</div><p>No mistakes to review in ${VARIANTS[vi].name}.</p><div class="row"><button id="allQ">Show all questions</button></div></div>`;
    document.getElementById("allQ").onclick=()=>{state.wrongOnly=false;save();buildOrder();pos=0;renderAll()};
    return;
  }
  if(pos>=order.length){ renderDone(); return; }
  const qi=order[pos], q=qs()[qi], a=state.answers[qi], answered=a!==undefined;
  c.innerHTML=`
    <div class="qnum"><span><b>${num(qi)}</b></span><span>${pos+1} of ${order.length} in this set</span></div>
    <p class="scenario">${q.s}</p>
    <p class="question">${q.q}</p>
    <div class="opts">${q.o.map((t,i)=>{
      let cls=""; if(answered){ if(i===q.a)cls="ok"; else if(i===a)cls="bad"; }
      return `<button class="opt ${cls}" data-i="${i}" ${answered?"disabled":""}><span class="l">${L[i]}</span><span>${t}</span></button>`;
    }).join("")}</div>
    ${answered?`<div class="explain"><strong>${a===q.a?"Correct":"Correct answer: "+L[q.a]}</strong>${q.e}</div>`:""}
    <div class="nav"><button class="prev" ${pos===0?"disabled":""}>Previous</button><button class="next">${pos===order.length-1?"See results":"Next question"}</button></div>`;
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  c.querySelector(".prev").onclick=()=>{if(pos>0){pos--;renderAll()}};
  c.querySelector(".next").onclick=()=>{pos++;renderAll()};
}
function renderDone(){
  const {ok,bad,n}=stats();
  const c=document.getElementById("card");
  c.innerHTML=`<div class="done"><div class="big">${ok}/${n}</div><p>${Math.round(ok/n*100)}% correct in ${VARIANTS[vi].name}${n-ok-bad?` · ${n-ok-bad} unanswered`:""}</p>
  <div class="row">${bad?`<button id="dWrong">Review ${bad} mistakes</button>`:""}<button class="alt" id="dReset">Start over</button><button class="alt" id="dBack">Back to questions</button></div></div>`;
  if(bad) document.getElementById("dWrong").onclick=()=>{state.wrongOnly=true;save();buildOrder();pos=0;renderAll()};
  document.getElementById("dReset").onclick=reset;
  document.getElementById("dBack").onclick=()=>{pos=0;renderAll()};
}
function answer(i){
  const qi=order[pos]; if(state.answers[qi]!==undefined) return;
  state.answers[qi]=i; save(); renderAll();
}
function reset(){ state.answers={}; state.wrongOnly=false; save(); buildOrder(); pos=0; renderAll(); }
function renderAll(){ renderVariants(); renderBar(); renderGrid(); renderCard(); }

document.getElementById("btnShuffle").onclick=()=>{state.shuffle=!state.shuffle;save();buildOrder();pos=0;renderAll()};
document.getElementById("btnWrong").onclick=()=>{state.wrongOnly=!state.wrongOnly;save();buildOrder();pos=0;renderAll()};
document.getElementById("btnReset").onclick=()=>{if(confirm("Clear all answers for "+VARIANTS[vi].name+"?"))reset()};
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toUpperCase();
  if(L.slice(0,5).includes(k) && pos<order.length){ const qi=order[pos]; if(L.indexOf(k)<qs()[qi].o.length) answer(L.indexOf(k)); }
  else if(e.key==="ArrowRight" && pos<order.length){pos++;renderAll()}
  else if(e.key==="ArrowLeft" && pos>0){pos--;renderAll()}
});
load(); renderAll();
</script>
